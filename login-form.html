<html>
    <head>
        <title>
            login form
        </title>
        <style>
            .login-form{
                background-color: lightblue;
                width: 400px;
                margin: 50px auto;
                padding: 20px;
                text-align: center;
                border-radius: 8px;
            }
            
        </style>
    </head>
    <body>
        <div class="login-form">
                        <form>
                <h1>
                    USER LOGIN FORM
                </h1>
                <label>enter the username: </label>
                <input type="text" id="username" placeholder="enter the username">
                <br>
                <br>
                <label>enter the password: </label>
                <input type="password" id="password" placeholder="enter the password">
                <br>
                <br>
                <label>enter the email: </label>
                <input type="email" id="email" placeholder="enter the email">
                <br>
                <br>
                

                <button type="button" onclick="saveData()">
                    Submit
                </button>
                
                <button type="reset">
                    Reset
                </button>
            </form>
            <p id="displayresult"></p>
            
            <script>
                function saveData() {
                    const username = document.getElementById("username").value;
                    const password = document.getElementById("password").value;
                    const email = document.getElementById("email").value;

                    
                    localStorage.setItem("username", username);
                    localStorage.setItem("password", password);
                    localStorage.setItem("email", email);

                    sessionStorage.setItem("username", username);
                    sessionStorage.setItem("password", password);
                    sessionStorage.setItem("email", email);
                    document.getElementById("displayresult").innerHTML = "Login details saved! Welcome, <strong>" + username + "</strong>";
                }
            </script>
        </div>
    </body>
</html>
